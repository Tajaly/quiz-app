name: Deploy

on:
  workflow_dispatch:
  # Deploy only commits on main that passed CI.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy (azd)
    # Skipped until `azd pipeline config` has created the repository variables.
    if: ${{ vars.AZURE_CLIENT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The exact commit that CI tested (workflow_run runs on the default branch).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Azure (OIDC federated credential)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          # Set by `azd pipeline config` only if the azd environment has extra config (e.g. prompted parameters).
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

      # Packages with `npm run build` (dependencies from `npm ci` above are reused) and zip-deploys `.deploy`.
      - name: Deploy application
        run: azd deploy --no-prompt
